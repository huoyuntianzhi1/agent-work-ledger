[package]
name = "agent-work-ledger"
version = "0.1.0"
description = "Local-first agent work ledger"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "agent_work_ledger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "1"
anyhow = "1"
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zstd = "0.13"
walkdir = "2"
regex = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
# Stage 5.5: bulk Sessions export as a single multi-file .zip
# (one .md per partition, plus a top-level INDEX.md).
zip = { version = "2", default-features = false, features = ["deflate"] }
# Tauri 2 IPC serialises args via JSON, so binary bytes cross the
# boundary as base64-encoded strings.
base64 = "0.22"

[features]
# default: nothing extra
default = []
# future: macOS menu bar
macos-tray = []

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
