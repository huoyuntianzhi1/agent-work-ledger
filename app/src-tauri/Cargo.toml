[workspace]
resolver = "2"
members = [
    "crates/awl-core",
    "crates/awl-db",
    "crates/awl-export",
    "crates/awl-ipc",
    "crates/awl-desktop",
]

# A minimal root `[package]` block so `tauri build` (which shells
# out to `cargo metadata`) has a `package` entry to read even when
# the actual binary lives in `crates/awl-desktop/`. The real
# crate data — including `[lib]`, `[[bin]]`, `[build-dependencies]`,
# and the binary source — stays in
# `crates/awl-desktop/Cargo.toml`; the root manifest has no
# `.rs` files of its own.
[package]
name = "agent-work-ledger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Agent Work Ledger — local-first macOS desktop app"
publish = false

# All actual source code is in the member crates. The root
# gets an empty `src/lib.rs` (a 1-line doc-comment stub) so
# `cargo metadata` has a target to report; `cargo build` at
# the workspace root will still skip it if you ask for a
# specific member. auto* flips are left at their defaults so
# the empty lib is auto-discovered.

# Agent Work Ledger is a private workspace; do not publish any of these
# crates to crates.io even by accident.
[workspace.package]
version = "0.5.4"
edition = "2021"
rust-version = "1.77"
license = "MIT OR Apache-2.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
